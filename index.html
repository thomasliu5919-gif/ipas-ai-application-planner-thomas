<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Thomas 的 iPAS AI 應用規劃師個人備考工作台" />
    <title>iPAS AI 應用規劃師｜Thomas 備考工作台</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar">
        <div class="brand"><span class="brand-mark">AI</span><div><strong>iPAS Navigator</strong><small>PERSONAL EXAM OS</small></div></div>
        <div class="profile-card"><div class="avatar">T</div><div><strong>Thomas</strong><span>備考者模式</span></div><span class="status-dot"></span></div>
        <nav class="nav" aria-label="主選單">
          <button class="nav-item active" data-view="dashboard"><span>⌂</span>總覽</button>
          <button class="nav-item" data-view="practice"><span>◎</span>開始練習</button>
          <button class="nav-item" data-view="study"><span>▤</span>學習地圖</button>
          <button class="nav-item" data-view="mistakes"><span>↗</span>錯題複習 <b id="mistake-badge">0</b></button>

        <div class="sidebar-bottom"><p>資料版本</p><strong>2026．學習指引整理版</strong><small>進度只保存在此瀏覽器</small><small style="display:block;margin-top:5px;color:var(--green)">GitHub Pages 靜態版｜無雲端收費服務</small><button id="reset-progress" class="text-button">重設我的進度</button></div>
      </aside>
      <main class="main-content">
        <header class="topbar"><div><span class="eyebrow">SATURDAY, AUG 09, 2026</span><h1 id="page-title">早安，Thomas</h1></div><div class="top-actions"><button id="theme-toggle" class="icon-button" aria-label="切換夜間模式">☼</button><button class="outline-button" data-view="practice">＋ 快速開始</button></div></header>
        <div id="app-view"></div>
      </main>
    </div>
    <script src="questions.js"></script>
    <script src="app.js"></script>
  </body>
</html>
